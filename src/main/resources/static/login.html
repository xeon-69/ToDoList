<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="flex justify-center items-center min-h-screen px-4">
    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-md border border-gray-100">
        <h4 class="text-2xl font-semibold text-center mb-5">Login</h4>

        <input type="text" id="username" class="w-full px-4 py-2 mb-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Username">

        <input type="password" id="password" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Password">

        <button class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition-colors cursor-pointer" onclick="login()">
            Login
        </button>

        <p id="error" class="text-red-600 mt-3 text-center text-sm min-h-[20px]"></p>
    </div>
</div>

<script src="./js/login.js"></script>
</body>
</html>
