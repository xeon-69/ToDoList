<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
        const token = localStorage.getItem('token');
        if (!token){
            window.location.href="./login.html"
        }
    </script>
</head>
<body class="max-w-5xl mx-auto mt-12 px-4 text-gray-800">

<nav class="w-full py-4 mb-6">
    <div class="flex justify-end" id="nav-tab" role="tablist">
        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg shadow-sm transition-colors cursor-pointer">
            Logout
        </button>
    </div>
</nav>

<div class="flex gap-2 mb-6">
    <input type="text" id="taskInput" class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white" placeholder="Enter task">
    <button class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition-colors cursor-pointer" onclick="createTask()">
        Add
    </button>
</div>

<ul id="taskList" class="flex flex-col gap-2 divide-y divide-gray-200"></ul>

<script src="./js/app.js"></script>
<script>
    function logout() {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
