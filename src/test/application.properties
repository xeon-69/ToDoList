# This overrides the main file ONLY during tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically creates tables from your @Entity classes before tests, then drops them after
spring.jpa.hibernate.ddl-auto=create-drop

# in src/test/resources/application.properties
jwt.expiration-ms=5000